# Hand-labeled golden set for retrieval + generation evaluation.
# Each entry: a realistic question a QA engineer might ask about this PRD,
# and the PRD section(s) that SHOULD ground the answer. Used to measure
# whether retrieval actually finds the right context, not just *a* context.

- id: g01
  question: "What happens when a customer upgrades their plan mid-cycle?"
  expected_sections:
